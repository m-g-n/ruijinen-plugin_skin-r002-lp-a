name: Create Release

on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  ZIP_NAME: ruijinen-skin-r002-lp-a.zip

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Get version from plugin root file
        id: get_version
        run: |
          version="$(bash .github/scripts/get-plugin-version.sh)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # 同じバージョンのリリース（タグ）が既に存在する場合はリリースをスキップする
      - name: Check existing release
        id: check
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          status=0
          git ls-remote --exit-code --tags origin "refs/tags/${VERSION}" > /dev/null || status=$?
          case "$status" in
            0)
              echo "::notice::バージョン ${VERSION} は既にリリース済みのため、リリース作成をスキップします"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              ;;
            2)
              echo "skip=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::タグの確認に失敗しました (exit ${status})"
              exit "$status"
              ;;
          esac

      # Node.js のバージョンは mise.toml で管理
      - name: Setup Node.js
        if: steps.check.outputs.skip == 'false'
        uses: jdx/mise-action@v5

      - name: Build CSS
        if: steps.check.outputs.skip == 'false'
        run: |
          npm ci
          npm run build

      - name: Composer install
        if: steps.check.outputs.skip == 'false'
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      # 配布に必要なファイルのみを zip に含める（zip 直下にファイルを配置）
      - name: Create zip
        if: steps.check.outputs.skip == 'false'
        run: |
          zip -r -q "$ZIP_NAME" \
            ruijinen-skin-r002-lp.php \
            readme.txt \
            README.md \
            App \
            dist \
            languages \
            vendor \
            -x '*.DS_Store'
          unzip -l "$ZIP_NAME" | tail -n 1

      - name: Create Release
        if: steps.check.outputs.skip == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          name: ${{ steps.get_version.outputs.version }}
          body: ${{ github.event.pull_request.body }}
          target_commitish: ${{ github.event.pull_request.merge_commit_sha }}
          files: ${{ env.ZIP_NAME }}

  # main の内容を dev へ反映する PR を作成（リリースをスキップした場合も実行）
  sync-dev:
    if: github.event.pull_request.merged == true
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Create pull request (main → dev)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ -n "$(gh pr list --base dev --head main --state open --json number --jq '.[].number')" ]]; then
            echo "::notice::main → dev の PR が既に存在するため作成をスキップします"
            exit 0
          fi
          if ! output="$(gh pr create --base dev --head main \
            --title 'リリース残処理：mainの内容をdevへ反映' \
            --body 'Pulling main into dev' 2>&1)"; then
            if grep -q 'No commits between' <<< "$output"; then
              echo "::notice::main と dev に差分がないため PR を作成しません"
              exit 0
            fi
            echo "$output" >&2
            exit 1
          fi
          echo "$output"
