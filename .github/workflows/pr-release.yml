name: Create release pull requests

on:
  pull_request:
    branches:
      - dev
    types: [closed]

permissions:
  contents: read
  pull-requests: write

jobs:
  create-release-pr:
    # main → dev の同期 PR がマージされた場合はリリース PR を作らない
    if: github.event.pull_request.merged == true && github.event.pull_request.head.ref != 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0

      - name: Get version from plugin root file
        id: get_version
        run: |
          version="$(bash .github/scripts/get-plugin-version.sh)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # README.md の変更履歴から該当バージョンの対応内容を取得し、リリース PR の本文に入れる
      - name: Get release notes from README
        id: get_notes
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          notes="$(bash .github/scripts/get-release-notes.sh "$VERSION")"
          delimiter="EOF_$(openssl rand -hex 8)"
          {
            echo "notes<<${delimiter}"
            echo "$notes"
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"

      - name: Create a release pull request
        uses: bakunyo/git-pr-release-action@ff3f59a20f467c0e9974fd815db563d4f26a52c9 # master
        with:
          # 本文は毎回自動生成した内容で上書きする
          args: --overwrite-description
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_PR_RELEASE_BRANCH_PRODUCTION: main
          GIT_PR_RELEASE_BRANCH_STAGING: dev
          GIT_PR_RELEASE_LABELS: release
          PKG_VERSION: ${{ steps.get_version.outputs.version }}
          RELEASE_NOTES: ${{ steps.get_notes.outputs.notes }}
          GIT_PR_RELEASE_TEMPLATE: .github/git-pr-release/.git-pr-release-template
